name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS universal
    # One universal binary covers Apple Silicon and Intel from a single Apple
    # Silicon runner. Hosted Intel runners are no longer reliably allocated, so
    # a per-architecture matrix leaves the Intel job queued indefinitely.
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # An unsigned bundle is installable but can never hold an Accessibility
      # grant: macOS lists it, accepts the toggle, and still reports the process
      # as untrusted. Build and check the signature before anything is published;
      # the release step below reuses this cached build.
      - name: Build and verify the signed bundle
        run: |
          pnpm tauri build --target universal-apple-darwin --bundles app
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Desktop Translator.app"
          codesign --verify --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -q '^Signature=' \
            || { echo "bundle is unsigned"; exit 1; }
          tools/release/audit-macos-bundle.sh "$app"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Desktop Translator ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target universal-apple-darwin
          releaseBody: |
            ## Install

            Download the `.dmg` and drag the app to Applications. The build is
            universal: it runs natively on both Apple Silicon and Intel Macs.

            These builds are **not signed with an Apple Developer ID**, so
            macOS Gatekeeper will refuse the first launch. To allow it, run:

            ```sh
            xattr -dr com.apple.quarantine "/Applications/Desktop Translator.app"
            ```

            On first run, grant Accessibility permission when prompted, then
            choose Google, Baidu, or Microsoft Translator in Settings and add
            that provider's credentials. Vocabulary Study includes an offline
            English to Simplified Chinese starter textbook.

            The app is ad-hoc signed, so its code identity changes with every
            release. After installing an update, macOS drops the old grant:
            remove the stale entry in Privacy & Security → Accessibility and
            add the new one.

            ## Platform support

            macOS (universal `.dmg` / `.app`) and Windows 10/11 x64 (NSIS
            `*_x64-setup.exe`). Windows installers are **not Authenticode
            signed**. See `docs/windows-signing-and-supply-chain.md`.

  windows:
    name: Windows x64
    needs: macos
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build NSIS
        run: pnpm tauri build --bundles nsis

      - name: Audit Windows bundle
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/audit-windows-bundle.ps1 src-tauri/target/release

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          $exe = Get-Item "src-tauri/target/release/desktop-translator.exe"
          @(
            (Get-FileHash -Algorithm SHA256 $nsis.FullName | ForEach-Object { "$($_.Hash.ToLower())  $($nsis.Name)" })
            (Get-FileHash -Algorithm SHA256 $exe.FullName | ForEach-Object { "$($_.Hash.ToLower())  $($exe.Name)" })
          ) | Set-Content -Encoding ascii "windows-sha256.txt"
          Get-Content "windows-sha256.txt"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*_x64-setup.exe

      - name: Upload audited Windows artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          $exe = Get-Item "src-tauri/target/release/desktop-translator.exe"
          gh release upload "$env:RELEASE_TAG" $nsis.FullName $exe.FullName "windows-sha256.txt" --clobber

  gitee:
    name: Gitee release mirror
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets

          if ! find release-assets -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "GitHub release $RELEASE_TAG has no downloadable assets" >&2
            exit 1
          fi

      - name: Create or reuse Gitee release
        id: gitee-release
        env:
          GITEE_PRIVATE_SECRET: ${{ secrets.GITEE_PRIVATE_SECRET }}
          GITEE_OWNER: shenglongliu
          GITEE_REPO: desktop-translator
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          : "${GITEE_PRIVATE_SECRET:?GITEE_PRIVATE_SECRET repository secret is required}"

          api="https://gitee.com/api/v5"
          release_url="$api/repos/$GITEE_OWNER/$GITEE_REPO/releases/tags/$RELEASE_TAG"
          response_file="$RUNNER_TEMP/gitee-release.json"
          status="$(curl --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 2 \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${GITEE_PRIVATE_SECRET}" \
            --output "$response_file" \
            --write-out "%{http_code}" \
            "$release_url")"

          if [ "$status" = "200" ] && jq -e 'type == "object" and (.id != null)' "$response_file" >/dev/null; then
            echo "Gitee release $RELEASE_TAG already exists; reusing it"
          elif [ "$status" = "404" ] || {
            [ "$status" = "200" ] &&
              jq -e 'type == "null" or (type == "object" and .id == null)' "$response_file" >/dev/null
          }; then
            release_body="Automated release for ${RELEASE_TAG}. GitHub source release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            curl --fail-with-body --silent --show-error --max-time 30 \
              --request POST \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${GITEE_PRIVATE_SECRET}" \
              --data-urlencode "tag_name=${RELEASE_TAG}" \
              --data-urlencode "name=Desktop Translator ${RELEASE_TAG}" \
              --data-urlencode "body=${release_body}" \
              --data-urlencode "target_commitish=main" \
              --output "$response_file" \
              "$api/repos/$GITEE_OWNER/$GITEE_REPO/releases"
            echo "Created Gitee release $RELEASE_TAG"
          else
            echo "Gitee release lookup failed (HTTP $status)" >&2
            exit 1
          fi

          release_id="$(jq -er '.id' "$response_file")"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload missing assets to Gitee
        env:
          GITEE_PRIVATE_SECRET: ${{ secrets.GITEE_PRIVATE_SECRET }}
          GITEE_OWNER: shenglongliu
          GITEE_REPO: desktop-translator
          RELEASE_ID: ${{ steps.gitee-release.outputs.release_id }}
        run: |
          set -euo pipefail
          : "${GITEE_PRIVATE_SECRET:?GITEE_PRIVATE_SECRET repository secret is required}"

          api="https://gitee.com/api/v5"
          attachments_url="$api/repos/$GITEE_OWNER/$GITEE_REPO/releases/$RELEASE_ID/attach_files"
          attachments_file="$RUNNER_TEMP/gitee-attachments.json"
          status="$(curl --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 2 \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${GITEE_PRIVATE_SECRET}" \
            --output "$attachments_file" \
            --write-out "%{http_code}" \
            "${attachments_url}?per_page=100")"
          if [ "$status" != "200" ]; then
            echo "Gitee attachment lookup failed (HTTP $status)" >&2
            exit 1
          fi
          jq -e 'type == "array"' "$attachments_file" >/dev/null

          while IFS= read -r -d '' file; do
            name="${file##*/}"
            if jq -e --arg name "$name" 'any(.[]; .name == $name)' "$attachments_file" >/dev/null; then
              echo "Gitee already has $name; skipping"
              continue
            fi

            curl --fail-with-body --silent --show-error --max-time 120 \
              --request POST \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${GITEE_PRIVATE_SECRET}" \
              --form "file=@${file}" \
              --output /dev/null \
              "$attachments_url"
            echo "Uploaded $name to Gitee"
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
