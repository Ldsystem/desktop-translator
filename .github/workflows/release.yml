name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS universal
    # One universal binary covers Apple Silicon and Intel from a single Apple
    # Silicon runner. Hosted Intel runners are no longer reliably allocated, so
    # a per-architecture matrix leaves the Intel job queued indefinitely.
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify release version metadata
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tag = process.env.RELEASE_TAG ?? "";
          const expected = tag.startsWith("v") ? tag.slice(1) : tag;
          const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
          const tauriVersion = JSON.parse(
            readFileSync("src-tauri/tauri.conf.json", "utf8"),
          ).version;
          const cargoToml = readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoLock = readFileSync("src-tauri/Cargo.lock", "utf8");
          const cargoVersion = cargoToml.match(
            /^\[package\]\s*$[\s\S]*?^version\s*=\s*"([^"]+)"/m,
          )?.[1];
          const lockVersion = cargoLock.match(
            /^name = "desktop-translator"\s*$\n^version = "([^"]+)"/m,
          )?.[1];
          const versions = { packageVersion, tauriVersion, cargoVersion, lockVersion };
          const mismatches = Object.entries(versions).filter(([, value]) => value !== expected);

          if (!expected || mismatches.length > 0) {
            console.error(`Release tag ${tag} does not match project versions:`, versions);
            process.exit(1);
          }
          console.log(`Release metadata matches ${tag}.`);
          NODE

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # An unsigned bundle is installable but can never hold an Accessibility
      # grant: macOS lists it, accepts the toggle, and still reports the process
      # as untrusted. Build and check the signature before anything is published;
      # the release step below reuses this cached build.
      - name: Build and verify the signed bundle
        run: |
          pnpm tauri build --target universal-apple-darwin --bundles app
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Desktop Translator.app"
          codesign --verify --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -q '^Signature=' \
            || { echo "bundle is unsigned"; exit 1; }
          tools/release/audit-macos-bundle.sh "$app"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Desktop Translator ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target universal-apple-darwin
          releaseBody: |
            ## Install

            Download the `.dmg` and drag the app to Applications. The build is
            universal: it runs natively on both Apple Silicon and Intel Macs.

            These builds are **not signed with an Apple Developer ID**, so
            macOS Gatekeeper will refuse the first launch. To allow it, run:

            ```sh
            xattr -dr com.apple.quarantine "/Applications/Desktop Translator.app"
            ```

            On first run, grant Accessibility permission when prompted, then
            choose Google, Baidu, or Microsoft Translator in Settings and add
            that provider's credentials. Vocabulary Study includes an offline
            English to Simplified Chinese starter textbook.

            The app is ad-hoc signed, so its code identity changes with every
            release. After installing an update, macOS drops the old grant:
            remove the stale entry in Privacy & Security → Accessibility and
            add the new one.

            ## Platform support

            macOS (universal `.dmg` / `.app`) and Windows 10/11 x64 (NSIS
            `*_x64-setup.exe`). Windows installers are **not Authenticode
            signed**. See `docs/windows-signing-and-supply-chain.md`.

  windows:
    name: Windows x64
    needs: macos
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build NSIS
        run: pnpm tauri build --bundles nsis

      - name: Audit Windows bundle
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/audit-windows-bundle.ps1 src-tauri/target/release

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          $exe = Get-Item "src-tauri/target/release/desktop-translator.exe"
          @(
            (Get-FileHash -Algorithm SHA256 $nsis.FullName | ForEach-Object { "$($_.Hash.ToLower())  $($nsis.Name)" })
            (Get-FileHash -Algorithm SHA256 $exe.FullName | ForEach-Object { "$($_.Hash.ToLower())  $($exe.Name)" })
          ) | Set-Content -Encoding ascii "windows-sha256.txt"
          Get-Content "windows-sha256.txt"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*_x64-setup.exe

      - name: Upload audited Windows artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          $exe = Get-Item "src-tauri/target/release/desktop-translator.exe"
          gh release upload "$env:RELEASE_TAG" $nsis.FullName $exe.FullName "windows-sha256.txt" --clobber

  cos:
    name: Tencent COS release mirror
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets

          if ! find release-assets -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "GitHub release $RELEASE_TAG has no downloadable assets" >&2
            exit 1
          fi

      - name: Check S3-compatible client
        run: aws --version

      - name: Upload release assets to Tencent COS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.COS_BUK_SEC_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.COS_BUK_SEC_KEY }}
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: "3"
          AWS_CONFIG_FILE: ${{ runner.temp }}/aws-config
          COS_BUCKET_DOMAIN: ${{ vars.COS_BUK_DOMAIN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?COS_BUK_SEC_ID repository secret is required}"
          : "${AWS_SECRET_ACCESS_KEY:?COS_BUK_SEC_KEY repository secret is required}"
          : "${COS_BUCKET_DOMAIN:?COS_BUK_DOMAIN repository variable is required}"

          domain="${COS_BUCKET_DOMAIN#https://}"
          domain="${domain#http://}"
          domain="${domain%%/*}"
          case "$domain" in
            *.cos.*.myqcloud.com) ;;
            *)
              echo "COS_BUK_DOMAIN must be a default COS domain such as bucket-appid.cos.region.myqcloud.com" >&2
              exit 1
              ;;
          esac

          bucket="${domain%%.cos.*}"
          endpoint="${domain#${bucket}.}"
          region="${endpoint#cos.}"
          region="${region%.myqcloud.com}"
          export AWS_DEFAULT_REGION="$region"
          printf '[default]\nregion = %s\ns3 =\n    addressing_style = virtual\n' "$region" \
            > "$AWS_CONFIG_FILE"

          # A release prefix is an exact mirror, so reruns cannot retain assets
          # produced by stale package metadata.
          timeout --signal=TERM --kill-after=15s 240s \
            aws s3 rm "s3://${bucket}/${REPOSITORY_NAME}/${RELEASE_TAG}/" \
              --recursive \
              --endpoint-url "https://${endpoint}" \
              --cli-connect-timeout 30 \
              --cli-read-timeout 120 \
              --only-show-errors \
              --no-cli-pager

          while IFS= read -r -d '' file; do
            name="${file##*/}"
            key="${REPOSITORY_NAME}/${RELEASE_TAG}/${name}"
            timeout --signal=TERM --kill-after=15s 240s \
              aws s3api put-object \
                --bucket "$bucket" \
                --key "$key" \
                --body "$file" \
                --acl public-read \
                --endpoint-url "https://${endpoint}" \
                --cli-connect-timeout 30 \
                --cli-read-timeout 120 \
                --no-cli-pager \
                >/dev/null
            echo "Uploaded $name to ${REPOSITORY_NAME}/${RELEASE_TAG}/"
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)

          {
            echo "## Tencent COS mirror"
            echo
            echo "Release assets:"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r -d '' file; do
            name="${file##*/}"
            encoded_name="$(jq -nr --arg value "$name" '$value | @uri')"
            public_url="https://${domain}/${REPOSITORY_NAME}/${RELEASE_TAG}/${encoded_name}"
            if ! curl --fail --silent --show-error --head \
              --connect-timeout 30 \
              --max-time 60 \
              --retry 3 \
              --retry-all-errors \
              "$public_url" >/dev/null; then
              echo "COS object is not publicly downloadable: $public_url" >&2
              echo "Ensure the upload identity may set public-read object ACLs." >&2
              exit 1
            fi
            echo "- [$name]($public_url)" >> "$GITHUB_STEP_SUMMARY"
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
