version: '1.0'
name: gitee-release
displayName: Publish release to Gitee

# Gitee mirrors source and tags from GitHub, but GitHub Release attachments
# are separate objects. Run this pipeline in Gitee after a mirrored v* tag
# arrives, then download the public GitHub assets and attach them locally.
triggers:
  push:
    tags:
      prefix:
        - v

stages:
  - stage:
      name: publish
      displayName: Publish release assets
      strategy: naturally
      trigger: auto
      steps:
        - step: shell@agent
          name: publish_gitee_release
          displayName: Download and publish release assets
          hostGroupID: gitee-go
          script: |
            set -eu
            bash tools/release/publish-gitee-release.sh

# Leave stepTimeout unset. Gitee Go documents that an omitted timeout has no
# pipeline timeout; the script still bounds each network request and verifies
# the attachment list after an upload response or timeout.
